<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- ✅ SEO META TAGS — helps Google find your site -->
  <title>NovaMind AI — Your Intelligent Assistant</title>
  <meta name="description" content="NovaMind is a free AI chatbot powered by Claude. Ask anything — get smart, instant answers." />
  <meta name="keywords" content="AI chatbot, Claude AI, free AI assistant, NovaMind" />
  <meta name="author" content="Your Name" />

  <!-- Open Graph (for sharing on social media) -->
  <meta property="og:title" content="NovaMind AI — Your Intelligent Assistant" />
  <meta property="og:description" content="Chat with a powerful AI assistant. Free and fast." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://your-site.vercel.app" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --panel:     #16161f;
      --border:    rgba(255,255,255,0.07);
      --accent:    #6ee7b7;
      --accent2:   #818cf8;
      --text:      #e8e8f0;
      --muted:     #6b6b80;
      --user-bg:   #1e1e2e;
      --ai-bg:     #13131a;
      --danger:    #f87171;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.7;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(110,231,183,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110,231,183,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glowing orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(110,231,183,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(120px, 80px); }
    }

    /* ─── LAYOUT ─── */
    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ─── HEADER ─── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo-name {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo-name span { color: var(--accent); }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 11px;
      color: var(--muted);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* ─── MESSAGES ─── */
    .messages {
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Welcome state */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 12px;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(110,231,183,0.15), rgba(129,140,248,0.15));
      border: 1px solid rgba(110,231,183,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome h2 {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      max-width: 320px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(110,231,183,0.05);
    }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 12px;
      animation: fadeUp 0.3s ease both;
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-top: 2px;
    }

    .avatar.ai  { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .avatar.usr { background: var(--user-bg); border: 1px solid var(--border); }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 13.5px;
    }

    .msg.ai   .bubble { background: var(--ai-bg);   border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
    .msg.user .bubble { background: var(--user-bg); border: 1px solid rgba(129,140,248,0.2); border-top-right-radius: 4px; color: var(--text); }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ─── INPUT AREA ─── */
    .input-area {
      padding: 16px 0 20px;
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: rgba(110,231,183,0.3);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.6;
      resize: none;
      max-height: 120px;
      min-height: 22px;
    }

    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      color: #0a0a0f;
    }

    #send-btn:hover   { background: #a7f3d0; transform: scale(1.05); }
    #send-btn:active  { transform: scale(0.96); }
    #send-btn:disabled { background: var(--muted); cursor: not-allowed; transform: none; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Error message */
    .error-msg {
      color: var(--danger);
      font-size: 12px;
      padding: 8px 12px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      margin-top: 8px;
      display: none;
    }

    /* Code blocks inside messages */
    .bubble pre {
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 12px;
    }

    .bubble code { font-family: var(--font-mono); }

    @media (max-width: 600px) {
      .bubble { max-width: 88%; }
      .welcome h2 { font-size: 18px; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span class="logo-name">Nova<span>Mind</span></span>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      AI Online
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <h2>What can I help with?</h2>
      <p>Ask me anything — I'm powered by Claude, one of the most capable AI assistants available.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Explain quantum computing</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Write a Python script</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">Help me study for exams</button>
        <button class="suggestion-btn" onclick="sendSuggestion(this)">What is digital forensics?</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="Message NovaMind..."
        rows="1"
        autofocus
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <p class="input-hint">Press Enter to send · Shift+Enter for new line</p>
  </div>

</div>

<script>
  // ─────────────────────────────────────────────────────
  // ⚙️  CONFIGURATION
  // Change this URL to your deployed backend URL
  // ─────────────────────────────────────────────────────
// 1. Add the word 'async' before the function name

  const BACKEND_URL = "https://ai-assisted-chatbox-for-digital-forensic.onrender.com/chat";


  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");
  const errorEl    = document.getElementById("error-msg");
  const welcomeEl  = document.getElementById("welcome");

  let conversationHistory = [];

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  // Enter to send, Shift+Enter for newline
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendSuggestion(btn) {
    inputEl.value = btn.textContent;
    sendMessage();
  }

  function appendMessage(role, text) {
    if (welcomeEl) welcomeEl.remove();

    const msg = document.createElement("div");
    msg.className = `msg ${role}`;

    const avatar = document.createElement("div");
    avatar.className = `avatar ${role === "user" ? "usr" : "ai"}`;
    avatar.textContent = role === "user" ? "You" : "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    // Basic markdown: bold, code blocks, inline code
    let html = text
      .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");

    bubble.innerHTML = html;
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const msg = document.createElement("div");
    msg.className = "msg ai typing";
    msg.id = "typing-indicator";

    const avatar = document.createElement("div");
    avatar.className = "avatar ai";
    avatar.textContent = "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>`;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing-indicator");
    if (t) t.remove();
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
    setTimeout(() => { errorEl.style.display = "none"; }, 5000);
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // Clear input
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;
    errorEl.style.display = "none";

    // Show user message
    appendMessage("user", text);

    // Add to history
    conversationHistory.push({ role: "user", content: text });

    // Show typing
    showTyping();

    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversationHistory }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Server error: ${res.status}`);
      }

      const data = await res.json();
      const reply = data.reply;

      // Add AI reply to history and display it
      conversationHistory.push({ role: "assistant", content: reply });
      appendMessage("ai", reply);

    } catch (err) {
      removeTyping();
      showError("⚠ Could not reach the server. Is your backend running? → " + err.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
